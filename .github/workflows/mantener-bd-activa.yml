name: Mantener base de datos activa

on:
  # Horario desactivado: el ping mantenía despierta la base y generaba cobro.
  # schedule:
  #   - cron: "0,30 14-23,0-1 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar /api/health
        run: curl -fsS https://app.aldmautocore.com/api/health