# Revisión automática: dependencias con vulnerabilidades y secretos en el código.
name: Seguridad

on:
  pull_request:
  push:
    branches: [main, inventario]
  schedule:
    - cron: "17 11 * * 1"   # lunes

permissions:
  contents: read

jobs:
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: npm audit (web-admin)
        working-directory: web-admin
        run: npm audit --audit-level=high

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --verbose
